apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

commonLabels:
  app: kustomwebapp

commonAnnotations:
  app: mykustom-annontations

namePrefix: kustom-   # Removed the indent / newline to keep it clean

nameSuffix: -v1       # Removed the list dash (-) since suffix is a single string value
